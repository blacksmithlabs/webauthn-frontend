---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webauthn-frontend
  namespace: webauthn
  labels:
    app: webauthn-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webauthn-frontend
  template:
    metadata:
      labels:
        app: webauthn-frontend
    spec:
      containers:
      - name: webauthn-frontend
        image: registry.blacksmithlabs.dev/webauthn-frontend:alpha
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webauthn-frontend-service
  namespace: webauthn
  labels:
    app: webauthn-frontend
spec:
  type: ClusterIP
  selector:
    app: webauthn-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webauthn-frontend-ingress
  namespace: webauthn
  labels:
    app: webauthn-frontend
spec:
  ingressClassName: public
  rules:
  - host: webauthn.blacksmithlabs.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webauthn-frontend-service
            port:
              number: 80